<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: #fff;
            overflow: hidden;
        }

        .error-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
        }

        .error-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 30px;
            padding: 60px 40px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            z-index: 2;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .error-icon {
            font-size: 60px;
            color: #00ffcc;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .error-container h1 {
            font-size: 150px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .error-container h1 span {
            color: #00ffcc;
        }

        .error-container h2 {
            font-size: 35px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .error-container p {
            color: #b3b3b3;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .outline-btn {
            background: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
        }

        .outline-btn:hover {
            background: rgba(0, 255, 204, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 204, 0.15);
        }

        .primary-btn {
            background: #00ffcc;
            color: #050505;
            border: 2px solid #00ffcc;
        }

        .primary-btn:hover {
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.5);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 40px 20px;
            }
            .error-container h1 {
                font-size: 100px;
            }
            .error-container h2 {
                font-size: 28px;
            }
            .error-container p {
                font-size: 16px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 15px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <section class="error-section">
        <div class="glow-bg"></div>
        
        <div class="error-container">
            <div class="error-icon gsap-astronaut">
                <i class="fas fa-user-astronaut"></i>
            </div>
            
            <h1 class="gsap-404">4<span>0</span>4</h1>
            <h2 class="gsap-text">Lost in Space!</h2>
            <p class="gsap-text">The page you are looking for has vanished into the digital void or never existed in the first place.</p>
            
            <div class="action-buttons gsap-btns">
                <button onclick="goBack()" class="btn outline-btn">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn primary-btn">
                    <i class="fas fa-home"></i> Go to Home
                </a>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        function goBack() {
            window.history.length > 1 ? window.history.back() : window.location.href = 'index.html';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline();

            tl.from(".error-container", {
                y: 50,
                opacity: 0,
                duration: 1,
                ease: "power3.out"
            })
            .from(".gsap-404", {
                scale: 0.5,
                opacity: 0,
                duration: 0.8,
                ease: "back.out(1.5)"
            }, "-=0.5")
            .from(".gsap-text", {
                y: 20,
                opacity: 0,
                duration: 0.6,
                stagger: 0.2,
                ease: "power2.out"
            }, "-=0.4")
            .from(".gsap-btns", {
                y: 20,
                opacity: 0,
                duration: 0.6,
                ease: "power2.out"
            }, "-=0.2");

            gsap.to(".gsap-astronaut", {
                y: -20,
                rotation: 10,
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            gsap.to(".gsap-404 span", {
                textShadow: "0 0 30px rgba(0,255,204,0.8)",
                duration: 2,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });
        });
    </script>
</body>
</html>
